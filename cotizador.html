<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cotizador EMGRISAC</title>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <style>
    :root { --azul:#243f86; --gris:#606170; --fondo:#f4f6fb; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial, sans-serif; background:var(--fondo); color:#111; }
    header { background:#fff; border-bottom:4px solid var(--azul); padding:18px 24px; }
    header h1 { margin:0; color:var(--azul); font-size:28px; }
    header p { margin:6px 0 0; color:#444; }
    main { max-width:1100px; margin:22px auto; padding:0 16px; }
    .card { background:#fff; border-radius:14px; padding:20px; box-shadow:0 8px 25px rgba(0,0,0,.08); margin-bottom:18px; }
    h2 { margin:0 0 14px; color:#0b1f55; font-size:20px; }
    label { font-weight:700; font-size:14px; display:block; margin-bottom:6px; }
    input, textarea, select { width:100%; padding:10px; border:1px solid #cfd3df; border-radius:9px; font-size:15px; }
    textarea { resize:vertical; min-height:42px; }
    .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
    .grid3 { display:grid; grid-template-columns:1fr 1fr 2.4fr 1fr auto; gap:10px; align-items:end; }
    .item { padding:12px; border:1px solid #e0e3ec; border-radius:12px; margin-bottom:10px; background:#fafafa; }
    button { border:0; border-radius:10px; padding:12px 16px; font-weight:700; cursor:pointer; font-size:15px; }
    .primary { background:var(--azul); color:#fff; }
    .secondary { background:#e9ecf5; color:#0b1f55; }
    .danger { background:#ffe8e8; color:#990000; }
    .actions { display:flex; gap:10px; flex-wrap:wrap; }
    .total { font-size:18px; font-weight:800; text-align:right; color:#0b1f55; }
    .note { color:#555; font-size:13px; line-height:1.4; }
    @media(max-width:800px) { .grid,.grid3 { grid-template-columns:1fr; } }
  </style>
</head>
<body>
<header>
  <h1>Cotizador EMGRISAC</h1>
  <p>Llena los datos y descarga tu plantilla Excel ya completada.</p>
</header>

<main>
  <section class="card">
    <h2>Datos de la cotización</h2>
    <div class="grid">
      <div><label>Razón social</label><input id="razon" placeholder="Cliente / empresa"></div>
      <div><label>RUC del cliente</label><input id="ruc" placeholder="Ej. 20123456789"></div>
      <div><label>Dirección</label><input id="direccion" placeholder="Dirección del cliente"></div>
      <div><label>Atención</label><input id="atencion" placeholder="Persona de contacto"></div>
      <div><label>Tipo de servicio</label><input id="tipo" placeholder="Ej. Fabricación de estructura metálica"></div>
      <div><label>Cotización N°</label><input id="cotizacion" placeholder="Ej. 0001"></div>
      <div><label>Días de validez</label><input id="validez" type="number" value="7" min="0" step="1" placeholder="Ej. 7"></div>
      <div><label>Adelanto (%)</label><input id="adelanto" type="number" value="50" min="0" max="100"></div>
    </div>
  </section>

  <section class="card">
    <h2>Productos / servicios</h2>
    <div id="items"></div>
    <div class="actions">
      <button class="secondary" onclick="agregarItem()">+ Agregar fila</button>
    </div>
    <p class="note">Tu plantilla tiene espacio en la tabla TABLA_PROD7 desde B23:F30, por eso esta versión exporta hasta 8 filas.</p>
    <p class="total" id="totalTexto">Total: S/ 0.00</p>
  </section>

  <section class="card">
    <div class="actions">
      <button class="primary" onclick="descargarExcel()">Descargar Excel</button>
      <button class="primary" onclick="descargarPDF()">Descargar PDF</button>
      <button class="secondary" onclick="limpiar()">Limpiar</button>
    </div>
    <p class="note" id="estado"></p>
  </section>
</main>

const MAX_FILAS = 8;

function b64ToUint8Array(base64) {
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

function money(n) {
  return "S/ " + (Number(n) || 0).toFixed(2);
}

function agregarItem(data={}) {
  const cont = document.getElementById("items");
  if (cont.children.length >= MAX_FILAS) {
    alert("La plantilla actual permite máximo 8 filas en TABLA_PROD7.");
    return;
  }
  const div = document.createElement("div");
  div.className = "item";
  div.innerHTML = `
    <div class="grid3">
      <div><label>Unidad</label><input class="unidad" value="${data.unidad || ""}" placeholder="und, kg, glb, m"></div>
      <div><label>Cantidad</label><input class="cantidad" type="number" step="0.01" value="${data.cantidad || ""}" oninput="calcularTotal()"></div>
      <div><label>Descripción</label><textarea class="descripcion" placeholder="Descripción del trabajo">${data.descripcion || ""}</textarea></div>
      <div><label>Costo unit.</label><input class="costo" type="number" step="0.01" value="${data.costo || ""}" oninput="calcularTotal()"></div>
      <button class="danger" onclick="this.closest('.item').remove(); calcularTotal()">Quitar</button>
    </div>`;
  cont.appendChild(div);
  calcularTotal();
}

function obtenerItems() {
  return Array.from(document.querySelectorAll(".item")).map(div => {
    const cantidad = Number(div.querySelector(".cantidad").value || 0);
    const costo = Number(div.querySelector(".costo").value || 0);
    return {
      unidad: div.querySelector(".unidad").value.trim(),
      cantidad,
      descripcion: div.querySelector(".descripcion").value.trim(),
      costo,
      subtotal: cantidad * costo
    };
  }).filter(x => x.unidad || x.cantidad || x.descripcion || x.costo);
}

function calcularTotal() {
  const subtotal = obtenerItems().reduce((s,x)=>s+x.subtotal,0);
  const total = subtotal * 1.18;
  document.getElementById("totalTexto").textContent = `Subtotal: ${money(subtotal)} | Total con IGV: ${money(total)}`;
}


function limpiarItems() {
  document.getElementById("items").innerHTML = "";
  calcularTotal();
}

function limpiar() {
  ["razon","ruc","direccion","atencion","tipo","cotizacion"].forEach(id => document.getElementById(id).value = "");
  document.getElementById("validez").value = 7;
  document.getElementById("adelanto").value = 50;
  limpiarItems();
  agregarItem();
}

function colToNumber(col) {
  let n = 0;
  for (const c of col) n = n * 26 + c.charCodeAt(0) - 64;
  return n;
}

function ensureCell(doc, ref) {
  const ns = "http://schemas.openxmlformats.org/spreadsheetml/2006/main";
  const sheetData = doc.getElementsByTagNameNS(ns, "sheetData")[0];
  const match = ref.match(/^([A-Z]+)(\d+)$/);
  const col = match[1], rowNum = match[2];
  let row = Array.from(doc.getElementsByTagNameNS(ns, "row")).find(r => r.getAttribute("r") === rowNum);
  if (!row) {
    row = doc.createElementNS(ns, "row");
    row.setAttribute("r", rowNum);
    sheetData.appendChild(row);
  }
  let cell = Array.from(row.getElementsByTagNameNS(ns, "c")).find(c => c.getAttribute("r") === ref);
  if (!cell) {
    cell = doc.createElementNS(ns, "c");
    cell.setAttribute("r", ref);
    const targetCol = colToNumber(col);
    const cells = Array.from(row.getElementsByTagNameNS(ns, "c"));
    let inserted = false;
    for (const existing of cells) {
      const existingCol = colToNumber(existing.getAttribute("r").match(/^([A-Z]+)/)[1]);
      if (existingCol > targetCol) {
        row.insertBefore(cell, existing);
        inserted = true;
        break;
      }
    }
    if (!inserted) row.appendChild(cell);
  }
  return cell;
}

function clearCell(cell) {
  Array.from(cell.childNodes).forEach(n => cell.removeChild(n));
  cell.removeAttribute("t");
}

function setString(doc, ref, value) {
  const ns = "http://schemas.openxmlformats.org/spreadsheetml/2006/main";
  const cell = ensureCell(doc, ref);
  clearCell(cell);
  cell.setAttribute("t", "inlineStr");
  const is = doc.createElementNS(ns, "is");
  const t = doc.createElementNS(ns, "t");
  t.setAttribute("xml:space", "preserve");
  t.textContent = value || "";
  is.appendChild(t);
  cell.appendChild(is);
}

function setNumber(doc, ref, value) {
  const ns = "http://schemas.openxmlformats.org/spreadsheetml/2006/main";
  const cell = ensureCell(doc, ref);
  clearCell(cell);
  const v = doc.createElementNS(ns, "v");
  v.textContent = String(Number(value) || 0);
  cell.appendChild(v);
}

function setFormula(doc, ref, formula) {
  const ns = "http://schemas.openxmlformats.org/spreadsheetml/2006/main";
  const cell = ensureCell(doc, ref);
  clearCell(cell);
  const f = doc.createElementNS(ns, "f");
  f.textContent = formula;
  const v = doc.createElementNS(ns, "v");
  v.textContent = "";
  cell.appendChild(f);
  cell.appendChild(v);
}

function setStyle(doc, ref, styleId) {
  const cell = ensureCell(doc, ref);
  cell.setAttribute("s", String(styleId));
}

function autoHeightRow(doc, rowNum) {
  const ns = "http://schemas.openxmlformats.org/spreadsheetml/2006/main";
  const row = Array.from(doc.getElementsByTagNameNS(ns, "row")).find(r => r.getAttribute("r") === String(rowNum));
  if (row) {
    row.removeAttribute("ht");
    row.removeAttribute("customHeight");
  }
}

function modificarDatos(xmlText, datos) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(xmlText, "application/xml");
  setNumber(doc, "C5", datos.validez);
  setString(doc, "C7", datos.razon);
  setString(doc, "C8", datos.direccion);
  setString(doc, "C9", datos.ruc);
  setString(doc, "C10", datos.atencion);
  setNumber(doc, "C12", datos.adelanto);
  setString(doc, "C14", datos.cotizacion);
  return new XMLSerializer().serializeToString(doc);
}

function modificarCoti(xmlText, datos, items) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(xmlText, "application/xml");

  setString(doc, "D19", datos.tipo);

  for (let i = 0; i < MAX_FILAS; i++) {
    const r = 23 + i;
    const item = items[i] || {unidad:"", cantidad:"", descripcion:"", costo:""};
    setString(doc, "B"+r, item.unidad || "");
    if (item.cantidad === "" || item.cantidad === undefined) setString(doc, "C"+r, "");
    else setNumber(doc, "C"+r, item.cantidad);
    setString(doc, "D"+r, item.descripcion || "");
    if (item.costo === "" || item.costo === undefined) setString(doc, "E"+r, "");
    else setNumber(doc, "E"+r, item.costo);
    if (item.unidad || item.cantidad || item.descripcion || item.costo) {
      setFormula(doc, "F"+r, `C${r}*E${r}`);
    } else {
      setString(doc, "F"+r, "");
    }

    // Mantiene el formato de tabla y activa ajuste de texto en las celdas generadas.
    // El estilo 7 ya existe en tu plantilla y tiene bordes + wrapText.
    ["B","C","D","E","F"].forEach(col => setStyle(doc, col + r, 7));
    autoHeightRow(doc, r);
  }

  return new XMLSerializer().serializeToString(doc);
}


async function obtenerLogoDataUrl() {
  const zip = await JSZip.loadAsync(b64ToUint8Array(TEMPLATE_B64));
  const posibles = ["xl/media/image1.png", "xl/media/image1.jpg", "xl/media/image1.jpeg"];
  for (const ruta of posibles) {
    const f = zip.file(ruta);
    if (f) {
      const b64 = await f.async("base64");
      const mime = ruta.endsWith(".png") ? "image/png" : "image/jpeg";
      return `data:${mime};base64,${b64}`;
    }
  }
  return null;
}

function nombreArchivo(datos, ext) {
  const cliente = datos.razon.replace(/[^a-zA-Z0-9áéíóúÁÉÍÓÚñÑ_-]+/g, "_").replace(/^_+|_+$/g, "").slice(0,30) || "Cliente";
  const numero = (datos.cotizacion || "SN").replace(/[^a-zA-Z0-9_-]+/g, "_");
  return `COT-${numero}-${cliente}.${ext}`;
}

function datosFormulario() {
  const validezRaw = document.getElementById("validez").value.trim();
  return {
    razon: document.getElementById("razon").value.trim(),
    ruc: document.getElementById("ruc").value.trim(),
    direccion: document.getElementById("direccion").value.trim(),
    atencion: document.getElementById("atencion").value.trim(),
    tipo: document.getElementById("tipo").value.trim(),
    cotizacion: document.getElementById("cotizacion").value.trim(),
    validezRaw,
    validez: Number(validezRaw || 0),
    adelanto: Number(document.getElementById("adelanto").value || 0)
  };
}

function validarCotizacion(datos, items) {
  if (!datos.razon) { alert("Coloca al menos la razón social."); return false; }
  if (!esEnteroNoNegativo(datos.validezRaw)) { alert("Los días de validez deben ser un número entero, por ejemplo: 7, 15 o 30."); return false; }
  if (items.length === 0) { alert("Agrega al menos una fila de producto o servicio."); return false; }
  return true;
}

function textoCorto(doc, txt, maxWidth) {
  if (!txt) return "";
  const partes = doc.splitTextToSize(String(txt), maxWidth);
  return partes[0] || "";
}

    const y0 = 87;

    function lineas(txt, maxWidth) {

    function altoFila(it) {
      if (!it) return rowH;
      const descLines = lineas(it.descripcion || "", cols[3]-cols[2]-3);
      const unidadLines = lineas(it.unidad || "", cols[1]-cols[0]-2.4);
      const n = Math.max(descLines.length, unidadLines.length, 1);

    }

    let y = y0;
    doc.setFillColor(...gris);

    // Condiciones y cuentas: se mantienen abajo si la tabla es normal,

function modificarWorkbookCalc(xmlText) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(xmlText, "application/xml");
  const ns = "http://schemas.openxmlformats.org/spreadsheetml/2006/main";
  let calcPr = doc.getElementsByTagNameNS(ns, "calcPr")[0];
  if (!calcPr) {
    calcPr = doc.createElementNS(ns, "calcPr");
    doc.documentElement.appendChild(calcPr);
  }
  calcPr.setAttribute("calcMode", "auto");
  calcPr.setAttribute("fullCalcOnLoad", "1");
  calcPr.setAttribute("forceFullCalc", "1");
  return new XMLSerializer().serializeToString(doc);
}

function esEnteroNoNegativo(valor) {
  return /^\d+$/.test(String(valor).trim());
}

function sumarDias(fecha, dias) {
  const d = new Date(fecha.getFullYear(), fecha.getMonth(), fecha.getDate());
  d.setDate(d.getDate() + Number(dias));
  return d;
}

function formatoFechaCorta(fecha) {
  return `${String(fecha.getDate()).padStart(2,"0")}/${String(fecha.getMonth()+1).padStart(2,"0")}/${String(fecha.getFullYear()).slice(2)}`;
}

function fechaNombre() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

async function descargarExcel() {
  const estado = document.getElementById("estado");
  try {
    if (typeof JSZip === "undefined") {
      alert("No cargó JSZip. Revisa tu conexión a internet o publica el HTML en GitHub Pages.");
      return;
    }

    const datos = datosFormulario();
    const items = obtenerItems();
    if (!validarCotizacion(datos, items)) return;

    estado.textContent = "Generando Excel...";
    const zip = await JSZip.loadAsync(b64ToUint8Array(TEMPLATE_B64));

    const datosXmlPath = "xl/worksheets/sheet1.xml";
    const cotiXmlPath = "xl/worksheets/sheet2.xml";

    const datosXml = await zip.file(datosXmlPath).async("text");
    const cotiXml = await zip.file(cotiXmlPath).async("text");
    const workbookXml = await zip.file("xl/workbook.xml").async("text");

    zip.file(datosXmlPath, modificarDatos(datosXml, datos));
    zip.file(cotiXmlPath, modificarCoti(cotiXml, datos, items));
    zip.file("xl/workbook.xml", modificarWorkbookCalc(workbookXml));

    if (zip.file("xl/calcChain.xml")) zip.remove("xl/calcChain.xml");

    const blob = await zip.generateAsync({
      type: "blob",
      mimeType: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
      compression: "DEFLATE"
    });

    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = nombreArchivo(datos, "xlsx");
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      URL.revokeObjectURL(a.href);
      a.remove();
    }, 1000);
    estado.textContent = "Excel descargado.";
  } catch (err) {
    console.error(err);
    estado.textContent = "Error: " + err.message;
    alert("No se pudo generar el Excel. Mira la consola del navegador para más detalle.");
  }
}
